<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stream Sync Friends</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Stream Sync</h1>
      <label>
        Backend URL
        <input id="backendUrl" placeholder="https://your-app.vercel.app" />
      </label>
      <label>
        Room
        <input id="roomId" placeholder="leafs-game" />
      </label>
      <label>
        Name
        <input id="displayName" placeholder="Alex" />
      </label>
      <label class="row">
        <input id="enabled" type="checkbox" />
        Enable sync
      </label>
      <div class="buttons">
        <button id="save">Save</button>
        <button id="mark">Mark now</button>
      </div>
      <div class="buttons">
        <button id="behind">I'm behind -1s</button>
        <button id="ahead">I'm ahead +1s</button>
      </div>
      <p id="status">Loading…</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
